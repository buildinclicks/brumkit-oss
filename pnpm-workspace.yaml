packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  # Core React
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4

  # TypeScript
  typescript: ^7.0.2
  '@types/node': ^26.2.0

  # Styling
  tailwindcss: ^4.3.3

  # Validation
  zod: ^4.4.3

  # Forms
  react-hook-form: ^7.85.0
  '@hookform/resolvers': ^5.8.0

  # Notifications
  sonner: ^2.0.8

  # Testing
  vitest: ^4.1.10
  '@vitest/coverage-v8': ^4.1.10
  '@vitest/ui': ^4.1.10

  # Linting
  eslint: ^10.8.1

  # Build tool (peer dep for vitest/vitejs-plugin-react)
  # Vite v8 is a major bump; keep on v7 until M7 or a dedicated upgrade PR
  vite: ^8.2.1

  # Redis
  ioredis: ^6.0.0
  '@upstash/redis': ^1.38.2
