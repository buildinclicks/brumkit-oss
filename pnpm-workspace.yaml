packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  # Core React
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3

  # TypeScript
  typescript: ^7.0.2
  '@types/node': ^26.1.1

  # Styling
  tailwindcss: ^4.3.3

  # Validation
  zod: ^4.4.3

  # Forms
  react-hook-form: ^7.83.0
  '@hookform/resolvers': ^5.5.7

  # Notifications
  sonner: ^2.0.7

  # Testing
  vitest: ^4.1.10
  '@vitest/coverage-v8': ^4.1.10
  '@vitest/ui': ^4.1.10

  # Linting
  eslint: ^10.8.0

  # Build tool (peer dep for vitest/vitejs-plugin-react)
  # Vite v8 is a major bump; keep on v7 until M7 or a dedicated upgrade PR
  vite: ^8.1.5

  # Redis
  ioredis: ^5.11.1
  '@upstash/redis': ^1.38.0
